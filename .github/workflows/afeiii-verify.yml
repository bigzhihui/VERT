name: Afeiii verification
on:
  push:
    branches: [brand/thirteen-month]
  pull_request:
    branches: [brand/thirteen-month]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cp .env.example .env
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run lint
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:smoke

      - name: Validate generated HTML and local links
        env:
          QUALITY_SCRIPT_SHA256: 5becf9c6ed5dd4b337082f8d844aafcb35ac467baa23035052163d66db98e71e
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/bigzhihui/afeiii-portal/a86bb6a690add16309c6b7db826b0d5a400dee4f/scripts/check_generated_quality.py' --output "${RUNNER_TEMP}/check_generated_quality.py"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"check_generated_quality.py"; assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["QUALITY_SCRIPT_SHA256"], "Quality checker integrity mismatch"'
          python3 "${RUNNER_TEMP}/check_generated_quality.py" --bootstrap --root build --tools "${RUNNER_TEMP}/afeiii-quality-tools" --baseline scripts/quality-baseline.json --output "${RUNNER_TEMP}/vert-quality.json"
